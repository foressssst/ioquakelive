name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Only the Windows build of a pre-release (x86 and x64): no Linux, no macOS, no ARM64'
        type: boolean
        default: false

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    if: ${{ !((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:')) || (github.event_name == 'workflow_dispatch' && inputs.windows_only)) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-22.04
          arch: x86_64
        - runner: ubuntu-22.04-arm
          arch: arm64
    env:
      BIN_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build \
          libfreetype-dev libogg-dev libvorbis-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
          libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
          libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
    - name: Build SDL3 from submodule
      run: |
        cmake -S code/SDL3 -B build/SDL3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-local" -DCMAKE_INSTALL_LIBDIR=lib \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
        cmake --build build/SDL3
        cmake --install build/SDL3
    - name: Compile
      run: |
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdl3-local/lib/pkgconfig"
        make release -j$(nproc)
    - name: Start the dedicated server once
      run: |
        mkdir -p empty
        timeout 60 build/release-linux-$BIN_ARCH/ioqlds.$BIN_ARCH +set fs_basepath "$PWD/empty" \
          +set fs_homepath "$PWD/empty" +quit > ded.log 2>&1 || true
        cat ded.log
        grep -q "linux-$BIN_ARCH" ded.log
    - name: Stage build outputs
      run: |
        mkdir -p staging/libs staging/engine
        cp build/release-linux-$BIN_ARCH/baseq3/cgame$BIN_ARCH.so  staging/libs/
        cp build/release-linux-$BIN_ARCH/baseq3/qagame$BIN_ARCH.so staging/libs/
        cp build/release-linux-$BIN_ARCH/baseq3/ui$BIN_ARCH.so     staging/libs/
        cp -L "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.so.0" build/release-linux-$BIN_ARCH/
        tar -C build/release-linux-$BIN_ARCH -cf staging/engine/linux-$BIN_ARCH.tar \
          ioquakelive.$BIN_ARCH ioquakelive-vulkan.$BIN_ARCH ioqlds.$BIN_ARCH opengl2$BIN_ARCH.so opengl1$BIN_ARCH.so vulkan$BIN_ARCH.so libSDL3.so.0
    - uses: actions/upload-artifact@v4
      with:
        name: libs-linux-${{ matrix.arch }}
        path: staging/libs/
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: engine-linux-${{ matrix.arch }}
        path: staging/engine/
        retention-days: 2

  macos-compile:
    name: macOS (compile + sign dylibs)
    if: (github.event_name == 'workflow_dispatch' && !inputs.windows_only) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: brew install freetype libogg libvorbis
    - name: Build SDL3 from submodule
      run: |
        cmake -S code/SDL3 -B build/SDL3 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-local" \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
        cmake --build build/SDL3 -j"$(sysctl -n hw.logicalcpu)"
        cmake --install build/SDL3
        install_name_tool -id @rpath/libSDL3.0.dylib \
          "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.0.dylib"
        codesign -f -s - "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.0.dylib"
    - name: Compile
      run: |
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdl3-local/lib/pkgconfig"
        make release USE_LOCAL_HEADERS=0 ARCH=arm64 -j$(sysctl -n hw.logicalcpu)
    - name: Import signing certificate
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KC_PWD:   ${{ secrets.MACOS_KEYCHAIN_PWD }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$CERT_B64" | base64 -d > cert.p12
        security create-keychain -p "$KC_PWD" build.keychain
        security default-keychain -s build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security unlock-keychain -p "$KC_PWD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import cert.p12 -k build.keychain -P "$CERT_PWD" \
          -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KC_PWD" build.keychain >/dev/null
        rm cert.p12
        IDENTITIES="$(security find-identity -v -p codesigning)"
        echo "Available codesigning identities:"
        echo "$IDENTITIES"
        IDENTITY="$(echo "$IDENTITIES" \
          | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' \
          | head -1)"
        if [ -z "$IDENTITY" ]; then
          echo "ERROR: no Developer ID Application identity found in keychain search list" >&2
          exit 1
        fi
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    - name: Sign game dylibs
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        for dylib in build/release-darwin-arm64/baseq3/cgamearm64.dylib \
                     build/release-darwin-arm64/baseq3/qagamearm64.dylib \
                     build/release-darwin-arm64/baseq3/uiarm64.dylib; do
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "$dylib"
          codesign --verify --strict --verbose=2 "$dylib"
        done

    - name: Stage build outputs
      run: |
        mkdir -p staging/libs staging/engine-raw
        cp build/release-darwin-arm64/baseq3/cgamearm64.dylib  staging/libs/
        cp build/release-darwin-arm64/baseq3/qagamearm64.dylib staging/libs/
        cp build/release-darwin-arm64/baseq3/uiarm64.dylib     staging/libs/
        cp "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.0.dylib" build/release-darwin-arm64/
        tar -C build/release-darwin-arm64 -cf staging/engine-raw/raw-macos-engine.tar \
          ioquakelive.arm64 ioqlds.arm64 opengl2arm64.dylib opengl1arm64.dylib vulkanarm64.dylib libSDL3.0.dylib
    - uses: actions/upload-artifact@v4
      with:
        name: libs-macos-arm64
        path: staging/libs/
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: raw-macos-engine
        path: staging/engine-raw/
        retention-days: 2

  macos-bundle:
    name: macOS (bundle + notarise)
    if: (github.event_name == 'workflow_dispatch' && !inputs.windows_only) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    needs: [linux, windows, macos-compile]
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install Dependencies
      run: brew install freetype libogg libvorbis
    - name: Download game library artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: libs-*
        path: iobin-stage
        merge-multiple: true
    - name: Build universal iobin.pk3
      run: |
        mkdir -p shared/baseq3
        python3 code/tools/make_deterministic_pk3.py \
          --input iobin-stage \
          --output shared/baseq3/iobin.pk3
        shasum -a 256 shared/baseq3/iobin.pk3
    - uses: actions/upload-artifact@v4
      with:
        name: iobin-pk3
        path: shared/baseq3/iobin.pk3
        retention-days: 2
    - name: Build deterministic pak01.pk3
      run: |
        python3 code/tools/make_deterministic_pk3.py \
          --input content/pak01 \
          --output shared/baseq3/pak01.pk3
        shasum -a 256 shared/baseq3/pak01.pk3
    - uses: actions/upload-artifact@v4
      with:
        name: pak01-pk3
        path: shared/baseq3/pak01.pk3
        retention-days: 2
    - name: Download raw macOS engine binaries
      uses: actions/download-artifact@v4
      with:
        name: raw-macos-engine
        path: raw-macos-engine
    - name: Unpack raw engine binaries into build tree
      run: |
        mkdir -p build/release-darwin-arm64/baseq3
        tar -xf raw-macos-engine/raw-macos-engine.tar -C build/release-darwin-arm64
        cp shared/baseq3/pak01.pk3 build/release-darwin-arm64/baseq3/pak01.pk3
        ls -l build/release-darwin-arm64/
    - name: Fetch MoltenVK
      env:
        MOLTENVK_VERSION: v1.4.2
        MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
      run: |
        set -euo pipefail
        curl -fsSL -o MoltenVK-macos.tar \
          "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-macos.tar"
        echo "${MOLTENVK_SHA256}  MoltenVK-macos.tar" | shasum -a 256 -c -
        tar -xf MoltenVK-macos.tar \
          MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib MoltenVK/LICENSE
        cp MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib build/release-darwin-arm64/
        cp MoltenVK/LICENSE build/release-darwin-arm64/MoltenVK-LICENSE.txt
    - name: Import signing certificate
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KC_PWD:   ${{ secrets.MACOS_KEYCHAIN_PWD }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$CERT_B64" | base64 -d > cert.p12
        security create-keychain -p "$KC_PWD" build.keychain
        security default-keychain -s build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security unlock-keychain -p "$KC_PWD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import cert.p12 -k build.keychain -P "$CERT_PWD" \
          -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KC_PWD" build.keychain >/dev/null
        rm cert.p12
        IDENTITIES="$(security find-identity -v -p codesigning)"
        echo "Available codesigning identities:"
        echo "$IDENTITIES"
        IDENTITY="$(echo "$IDENTITIES" \
          | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' \
          | head -1)"
        if [ -z "$IDENTITY" ]; then
          echo "ERROR: no Developer ID Application identity found in keychain search list" >&2
          exit 1
        fi
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    - name: Create App Bundle
      env:
        PREBUILT_IOBIN_PK3: ${{ github.workspace }}/shared/baseq3/iobin.pk3
      run: |
        chmod +x make-macosx-app.sh
        ./make-macosx-app.sh release arm64

    - name: Verify bundled pk3s
      run: |
        set -euo pipefail
        APP=build/release-darwin-arm64/ioquakelive.app
        BASE="$APP/Contents/Resources/baseq3"
        echo "Listing $BASE:"
        ls -la "$BASE" || { echo "ERROR: $BASE does not exist" >&2; exit 1; }
        missing=0
        for pk3 in iobin.pk3 pak01.pk3; do
          if [ ! -f "$BASE/$pk3" ]; then
            echo "ERROR: $BASE/$pk3 is missing from the .app bundle" >&2
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1
        shasum -a 256 "$BASE/iobin.pk3" "$BASE/pak01.pk3"
        echo "Listing $APP/Contents/Frameworks:"
        ls -la "$APP/Contents/Frameworks"

    - name: Codesign app bundle
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "Signing with: $IDENTITY"

        APP=build/release-darwin-arm64/ioquakelive.app

        find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
          | while IFS= read -r -d '' lib; do
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$lib"
            done

        find "$APP/Contents/MacOS" -type f -print0 \
          | while IFS= read -r -d '' bin; do
              if file "$bin" | grep -q 'Mach-O'; then
                codesign --force --options runtime --timestamp \
                  --sign "$IDENTITY" "$bin"
              fi
            done

        codesign --force --options runtime --timestamp \
          --sign "$IDENTITY" "$APP"
        codesign --verify --strict --verbose=2 "$APP"

    - name: Notarise and staple
      env:
        CERT_B64:   ${{ secrets.MACOS_CERTIFICATE_P12 }}
        KEY_ID:     ${{ secrets.MACOS_NOTARY_KEY_ID }}
        KEY_ISSUER: ${{ secrets.MACOS_NOTARY_KEY_ISSUER }}
        KEY_P8:     ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$KEY_P8" | base64 -d > AuthKey.p8
        APP=build/release-darwin-arm64/ioquakelive.app
        ditto -c -k --keepParent "$APP" ioquakelive-notarise.zip

        SUBMIT_OUT="$(xcrun notarytool submit ioquakelive-notarise.zip \
          --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$KEY_ISSUER" \
          --wait 2>&1 | tee /dev/stderr)"
        SUBMIT_ID="$(echo "$SUBMIT_OUT" | awk '/^  id:/ {print $2; exit}')"
        STATUS="$(echo "$SUBMIT_OUT" | awk '/^  status:/ {print $2; exit}')"
        echo "submission id: $SUBMIT_ID"
        echo "status:        $STATUS"

        if [ -n "$SUBMIT_ID" ]; then
          echo "----- notarisation log -----"
          xcrun notarytool log "$SUBMIT_ID" \
            --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$KEY_ISSUER" || true
          echo "----- end notarisation log -----"
        fi

        rm -f AuthKey.p8 ioquakelive-notarise.zip

        if [ "$STATUS" != "Accepted" ]; then
          echo "ERROR: notarisation status was '$STATUS', expected 'Accepted'" >&2
          exit 1
        fi

        xcrun stapler staple "$APP"
        xcrun stapler validate "$APP"

    - name: Stage final app bundle
      run: |
        set -euo pipefail
        mkdir -p staging/engine
        tar -C build/release-darwin-arm64 -cf staging/engine/ioquakelive.app.tar ioquakelive.app
        BASE="ioquakelive.app/Contents/Resources/baseq3"
        for pk3 in iobin.pk3 pak01.pk3; do
          if ! tar -tf staging/engine/ioquakelive.app.tar "$BASE/$pk3" >/dev/null 2>&1; then
            echo "ERROR: $BASE/$pk3 missing from staged ioquakelive.app.tar" >&2
            exit 1
          fi
        done
        tar -xOf staging/engine/ioquakelive.app.tar "$BASE/iobin.pk3" | shasum -a 256
        tar -xOf staging/engine/ioquakelive.app.tar "$BASE/pak01.pk3" | shasum -a 256
    - uses: actions/upload-artifact@v4
      with:
        name: engine-macos-arm64
        path: staging/engine/
        retention-days: 2

  windows:
    name: Windows ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:'))
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:')) || (github.event_name == 'workflow_dispatch' && inputs.windows_only)) && '[{"platform":"Win32","dir":"x86","arch":"x86"},{"platform":"x64","dir":"x64","arch":"x86_64"}]' || '[{"platform":"Win32","dir":"x86","arch":"x86"},{"platform":"x64","dir":"x64","arch":"x86_64"},{"platform":"ARM64","dir":"arm64","arch":"arm64"}]') }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install VS 2026 Build Tools (v145)
      shell: pwsh
      run: |
        Write-Host "Installing VS 2026 Build Tools..."
        choco install visualstudio2026buildtools `
          --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --includeRecommended --quiet" `
          -y --ignore-package-exit-codes=3010
        Write-Host "VS 2026 Build Tools installation completed"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build SDL3 for ARM64
      if: matrix.platform == 'ARM64'
      shell: pwsh
      run: ./code/tools/Build-SDL3.ps1

    - name: Build Solution
      run: msbuild misc/msvc/ioquakelive.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v145 /m

    - name: Build the dedicated server
      run: msbuild misc/msvc/ioqlds.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v145 /m

    - name: Stage build outputs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging/libs   | Out-Null
        New-Item -ItemType Directory -Force -Path staging/engine | Out-Null
        Copy-Item build/Release/${{ matrix.dir }}/baseq3/cgame${{ matrix.arch }}.dll  staging/libs/
        Copy-Item build/Release/${{ matrix.dir }}/baseq3/qagame${{ matrix.arch }}.dll staging/libs/
        Copy-Item build/Release/${{ matrix.dir }}/baseq3/ui${{ matrix.arch }}.dll     staging/libs/
        Copy-Item build/Release/${{ matrix.dir }}/*.exe staging/engine/
        Copy-Item build/Release/${{ matrix.dir }}/*.dll staging/engine/
    - uses: actions/upload-artifact@v4
      with:
        name: libs-windows-${{ matrix.dir }}
        path: staging/libs/
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: engine-windows-${{ matrix.dir }}
        path: staging/engine/
        retention-days: 2

  package:
    name: Package release artifacts
    if: (github.event_name == 'workflow_dispatch' && !inputs.windows_only) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    needs: [linux, macos-bundle, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download engine artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: engine-*
        path: engines
    - name: Unpack tarred engine artifacts
      run: |
        for tar in engines/engine-linux-x86_64/linux-x86_64.tar \
                   engines/engine-linux-arm64/linux-arm64.tar \
                   engines/engine-macos-arm64/ioquakelive.app.tar; do
          if [ -f "$tar" ]; then
            tar -xf "$tar" -C "$(dirname "$tar")"
            rm "$tar"
          fi
        done
        ls -l engines/engine-linux-x86_64/ioquakelive.x86_64
        ls -l engines/engine-linux-arm64/ioquakelive.arm64
        ls -l engines/engine-macos-arm64/ioquakelive.app/Contents/MacOS/
    - name: Download universal iobin.pk3
      uses: actions/download-artifact@v4
      with:
        name: iobin-pk3
        path: shared/baseq3/
    - name: Download deterministic pak01.pk3
      uses: actions/download-artifact@v4
      with:
        name: pak01-pk3
        path: shared/baseq3/
    - name: Verify shared artifact hashes
      run: sha256sum shared/baseq3/iobin.pk3 shared/baseq3/pak01.pk3
    - name: Build per-platform release zips
      run: |
        python code/tools/build_release_zips.py \
          --shared shared \
          --server content/server \
          --engines engines \
          --output build
        ls -la build/
    - uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: build/*.zip
        retention-days: 2

  package-windows:
    name: Package the Windows pre-release
    if: ${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:')) || (github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download game library artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: libs-windows-*
        path: iobin-stage
        merge-multiple: true
    - name: Build iobin.pk3
      run: |
        mkdir -p shared/baseq3
        python3 code/tools/make_deterministic_pk3.py \
          --input iobin-stage \
          --output shared/baseq3/iobin.pk3
    - name: Build deterministic pak01.pk3
      run: |
        python3 code/tools/make_deterministic_pk3.py \
          --input content/pak01 \
          --output shared/baseq3/pak01.pk3
    - name: Download engine artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: engine-windows-*
        path: engines
    - name: Build the release zips
      run: |
        python code/tools/build_release_zips.py \
          --shared shared \
          --server content/server \
          --engines engines \
          --output build
        ls -la build/
        sha256sum build/*.zip
    - uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: build/*.zip
        retention-days: 2

  prerelease:
    name: Create Pre-release
    needs: [package-windows]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from commit message
      id: version
      env:
        MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$MSG" | head -1 | sed 's/^prerelease: *//')
        CODE=$(sed -n 's/^#define PRODUCT_VERSION "\(.*\)"/\1/p' code/qcommon/q_shared.h)
        if [ "$CODE" != "$VERSION" ]; then
          echo "::error::prerelease: ${VERSION}, but PRODUCT_VERSION in code/qcommon/q_shared.h is ${CODE}"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Create tag
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    - uses: actions/download-artifact@v4
      with:
        name: release-zips
        path: artifacts
    - name: Create Pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.version }}
        files: artifacts/*.zip
        prerelease: true

  release:
    name: Create Release
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from commit message
      id: version
      env:
        MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$MSG" | head -1 | sed 's/^release: *//')
        CODE=$(sed -n 's/^#define PRODUCT_VERSION "\(.*\)"/\1/p' code/qcommon/q_shared.h)
        if [ "$CODE" != "$VERSION" ]; then
          echo "::error::release: ${VERSION}, but PRODUCT_VERSION in code/qcommon/q_shared.h is ${CODE}"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Create tag
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    - uses: actions/download-artifact@v4
      with:
        name: release-zips
        path: artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.version }}
        files: artifacts/*.zip
        generate_release_notes: true
