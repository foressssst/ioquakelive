// Sample configuration for an ioqlds server.
//
// ioqlds reads this by itself at startup when it is called server.cfg and sits
// in baseq3/, the same way retail's qzeroded does. Everything here has the same
// meaning it has in retail Quake Live; where the two differ, the difference is
// noted.

set sv_hostname "An ioquakelive server"
set sv_maxclients "16"
set g_password ""

// The access list: who is admin, moderator or banned, by Steam ID. One line per
// account, "<steamid>|(mod|admin|ban)". The server rewrites this file on a map
// change, so edit it with the server down or use /reload_access afterwards.
set g_accessFile "access.txt"

// What may be voted on. Add up to disable:
//   map 1, map_restart 2, nextmap 4, gametype 8, kick 16, timelimit 32,
//   fraglimit 64, shuffle 128, teamsize 256, cointoss 512, loadouts 1024,
//   end-of-map voting 2048, ammo 4096, item timers 8192
set g_voteFlags "0"

// Flood protection: the client command rate and the userinfo change counter.
// sv_floodProtect is a leaky bucket, not a yes/no: the score rises by one per
// command and decays by one per second, and a client past it is dropped.
set sv_floodProtect "10"
set g_floodprot_maxcount "10"
set g_floodprot_decay "1000"

// Shut down after this many seconds with no map loaded, so whatever supervises
// the server can bring it back up. 0 never shuts down.
set sv_idleExit "120"

// Quit instead of carrying on quietly when the IP and port cannot be taken.
set net_strict "0"

// Stats and rcon over ZeroMQ, as retail does. A passwordless rcon only accepts
// connections from this machine, which is a deliberate divergence from retail.
set zmq_rcon_enable "0"
set zmq_rcon_password ""
set zmq_stats_enable "0"
set zmq_stats_password ""

// The command that runs once the server has finished coming up.
set serverstartup "map campgrounds ffa"
