name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a build be started by hand, without a dummy commit.
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo apt-get update
        # SDL3 is built below from the submodule; these are the backends it
        # compiles in, and it loads each one at run time only if it is there
        sudo apt-get install -y cmake ninja-build \
          libfreetype-dev libogg-dev libvorbis-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
          libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
          libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
    - name: Build SDL3 from submodule
      # Ubuntu 22.04 has no SDL3, and most players' distributions do not yet:
      # it is built here and ships beside the game
      run: |
        cmake -S code/SDL3 -B build/SDL3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-local" -DCMAKE_INSTALL_LIBDIR=lib \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
        cmake --build build/SDL3
        cmake --install build/SDL3
    - name: Compile
      run: |
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdl3-local/lib/pkgconfig"
        make release -j$(nproc)
    - name: Stage build outputs
      run: |
        mkdir -p staging/libs staging/engine
        cp build/release-linux-x86_64/baseq3/cgamex86_64.so  staging/libs/
        cp build/release-linux-x86_64/baseq3/qagamex86_64.so staging/libs/
        cp build/release-linux-x86_64/baseq3/uix86_64.so     staging/libs/
        # SDL3 beside the game: the client's rpath is $ORIGIN
        cp -L "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.so.0" build/release-linux-x86_64/
        # actions/upload-artifact strips +x; tar to preserve mode bits.
        tar -C build/release-linux-x86_64 -cf staging/engine/linux-x86_64.tar \
          ioquakelive.x86_64 ioquakelive-vulkan.x86_64 ioqlds.x86_64 opengl2x86_64.so opengl1x86_64.so vulkanx86_64.so libSDL3.so.0
    - uses: actions/upload-artifact@v4
      with:
        name: libs-linux-x86_64
        path: staging/libs/
    - uses: actions/upload-artifact@v4
      with:
        name: engine-linux-x86_64
        path: staging/engine/

  macos-compile:
    name: macOS (compile + sign dylibs)
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Dependencies
      # No brew SDL: a Homebrew dylib dies on user machines without Homebrew.
      # SDL3 is built from the code/SDL3 submodule below instead.
      run: brew install freetype libogg libvorbis
    - name: Build SDL3 from submodule
      run: |
        cmake -S code/SDL3 -B build/SDL3 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-local" \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
        cmake --build build/SDL3 -j"$(sysctl -n hw.logicalcpu)"
        cmake --install build/SDL3
        # The engine records the dylib id at link time; force @rpath so the
        # binary resolves it via the .app's Frameworks rpath regardless of
        # SDL's install-name default. Re-sign ad hoc afterwards (arm64
        # requires a valid signature; install_name_tool invalidates it).
        install_name_tool -id @rpath/libSDL3.0.dylib \
          "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.0.dylib"
        codesign -f -s - "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.0.dylib"
    - name: Compile
      # pkg-config must resolve to the submodule build; losing this export
      # fails the link loudly instead of silently picking another SDL.
      run: |
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdl3-local/lib/pkgconfig"
        make release USE_LOCAL_HEADERS=0 ARCH=arm64 -j$(sysctl -n hw.logicalcpu)
    - name: Import signing certificate
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KC_PWD:   ${{ secrets.MACOS_KEYCHAIN_PWD }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$CERT_B64" | base64 -d > cert.p12
        security create-keychain -p "$KC_PWD" build.keychain
        security default-keychain -s build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security unlock-keychain -p "$KC_PWD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import cert.p12 -k build.keychain -P "$CERT_PWD" \
          -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KC_PWD" build.keychain >/dev/null
        rm cert.p12
        IDENTITIES="$(security find-identity -v -p codesigning)"
        echo "Available codesigning identities:"
        echo "$IDENTITIES"
        IDENTITY="$(echo "$IDENTITIES" \
          | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' \
          | head -1)"
        if [ -z "$IDENTITY" ]; then
          echo "ERROR: no Developer ID Application identity found in keychain search list" >&2
          exit 1
        fi
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    - name: Sign game dylibs
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        # Sign here (not in macos-bundle) so the signed bytes are baked into
        # the libs-macos-arm64 artifact. The downstream universal iobin.pk3
        # is built from those bytes; signatures embed in Mach-O and survive
        # the pk3 round-trip.
        for dylib in build/release-darwin-arm64/baseq3/cgamearm64.dylib \
                     build/release-darwin-arm64/baseq3/qagamearm64.dylib \
                     build/release-darwin-arm64/baseq3/uiarm64.dylib; do
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "$dylib"
          codesign --verify --strict --verbose=2 "$dylib"
        done

    - name: Stage build outputs
      run: |
        mkdir -p staging/libs staging/engine-raw
        cp build/release-darwin-arm64/baseq3/cgamearm64.dylib  staging/libs/
        cp build/release-darwin-arm64/baseq3/qagamearm64.dylib staging/libs/
        cp build/release-darwin-arm64/baseq3/uiarm64.dylib     staging/libs/
        # Ship the submodule-built SDL3 beside the raw binaries so
        # make-macosx-app.sh can bundle it into Contents/Frameworks/.
        cp "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.0.dylib" build/release-darwin-arm64/
        # Tar the raw engine binaries to preserve +x. These are unsigned;
        # macos-bundle codesigns them after they're placed inside the .app.
        tar -C build/release-darwin-arm64 -cf staging/engine-raw/raw-macos-engine.tar \
          ioquakelive.arm64 ioqlds.arm64 opengl2arm64.dylib opengl1arm64.dylib vulkanarm64.dylib libSDL3.0.dylib
    - uses: actions/upload-artifact@v4
      with:
        name: libs-macos-arm64
        path: staging/libs/
    - uses: actions/upload-artifact@v4
      with:
        name: raw-macos-engine
        path: staging/engine-raw/

  macos-bundle:
    name: macOS (bundle + notarise)
    needs: [linux, windows, macos-compile]
    runs-on: macos-14
    env:
      # pak01 carries art that cannot go in this repo (Handel Gothic Ex, CPMA 1.53's
      # frames, the menu background). It lives in a private repo read with a deploy
      # key: a fork has no key and builds without it, a release never does.
      HAS_ASSETS_KEY: ${{ secrets.ASSETS_DEPLOY_KEY != '' }}
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:') }}
    steps:
    - uses: actions/checkout@v4
    - name: Check out the art that is not in git
      if: env.HAS_ASSETS_KEY == 'true'
      uses: actions/checkout@v4
      with:
        repository: foressssst/ioquakelive-assets
        ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
        path: assets-pak01
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install Dependencies
      # Needed by make-macosx-app.sh's Homebrew dylib bundling step (otool /
      # install_name_tool walk against the actual brew-installed dylibs).
      # No brew SDL: the submodule-built libSDL3 arrives via the
      # raw-macos-engine artifact.
      run: brew install freetype libogg libvorbis
    - name: Download game library artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: libs-*
        path: iobin-stage
        merge-multiple: true
    - name: Build universal iobin.pk3
      run: |
        mkdir -p shared/baseq3
        python3 code/tools/make_deterministic_pk3.py \
          --input iobin-stage \
          --output shared/baseq3/iobin.pk3
        shasum -a 256 shared/baseq3/iobin.pk3
    - uses: actions/upload-artifact@v4
      with:
        name: iobin-pk3
        path: shared/baseq3/iobin.pk3
    - name: Build deterministic pak01.pk3
      run: |
        EXTRA=""
        if [ -d assets-pak01 ]; then
          EXTRA="--input assets-pak01"
        elif [ "$IS_RELEASE" = "true" ]; then
          echo "::error::a release needs the art from ioquakelive-assets (secret ASSETS_DEPLOY_KEY)"
          exit 1
        fi
        python3 code/tools/make_deterministic_pk3.py \
          --input content/pak01 $EXTRA \
          --output shared/baseq3/pak01.pk3
        shasum -a 256 shared/baseq3/pak01.pk3
    - uses: actions/upload-artifact@v4
      with:
        name: pak01-pk3
        path: shared/baseq3/pak01.pk3
    - name: Download raw macOS engine binaries
      uses: actions/download-artifact@v4
      with:
        name: raw-macos-engine
        path: raw-macos-engine
    - name: Unpack raw engine binaries into build tree
      run: |
        mkdir -p build/release-darwin-arm64/baseq3
        tar -xf raw-macos-engine/raw-macos-engine.tar -C build/release-darwin-arm64
        # make-macosx-app.sh picks up pak01.pk3 from this path automatically.
        cp shared/baseq3/pak01.pk3 build/release-darwin-arm64/baseq3/pak01.pk3
        ls -l build/release-darwin-arm64/
    - name: Fetch MoltenVK
      # The Vulkan renderer runs over Metal through MoltenVK (Apache 2.0). The
      # official universal build, pinned by version and hash; it wants macOS
      # 12, and on 11 the engine falls back to opengl1 by itself.
      env:
        MOLTENVK_VERSION: v1.4.2
        MOLTENVK_SHA256: f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e
      run: |
        set -euo pipefail
        curl -fsSL -o MoltenVK-macos.tar \
          "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-macos.tar"
        echo "${MOLTENVK_SHA256}  MoltenVK-macos.tar" | shasum -a 256 -c -
        tar -xf MoltenVK-macos.tar \
          MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib MoltenVK/LICENSE
        cp MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib build/release-darwin-arm64/
        cp MoltenVK/LICENSE build/release-darwin-arm64/MoltenVK-LICENSE.txt
    - name: Import signing certificate
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KC_PWD:   ${{ secrets.MACOS_KEYCHAIN_PWD }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$CERT_B64" | base64 -d > cert.p12
        security create-keychain -p "$KC_PWD" build.keychain
        security default-keychain -s build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        security unlock-keychain -p "$KC_PWD" build.keychain
        security set-keychain-settings -lut 21600 build.keychain
        security import cert.p12 -k build.keychain -P "$CERT_PWD" \
          -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KC_PWD" build.keychain >/dev/null
        rm cert.p12
        IDENTITIES="$(security find-identity -v -p codesigning)"
        echo "Available codesigning identities:"
        echo "$IDENTITIES"
        IDENTITY="$(echo "$IDENTITIES" \
          | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' \
          | head -1)"
        if [ -z "$IDENTITY" ]; then
          echo "ERROR: no Developer ID Application identity found in keychain search list" >&2
          exit 1
        fi
        echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    - name: Create App Bundle
      env:
        # Tell make-macosx-app.sh to use the universal iobin.pk3 we just built
        # (containing signed macOS dylibs + Linux .so + Windows .dll) instead
        # of building a macOS-only one from local dylibs.
        PREBUILT_IOBIN_PK3: ${{ github.workspace }}/shared/baseq3/iobin.pk3
      run: |
        chmod +x make-macosx-app.sh
        ./make-macosx-app.sh release arm64

    - name: Verify bundled pk3s
      # Hard-fail if the .app is missing iobin.pk3 / pak01.pk3 in
      # Contents/Resources/baseq3/. Without these the engine boots into
      # "VM_Create: failed to extract game module 'ui'" at runtime, but the
      # rest of the pipeline (codesign, notarisation) will happily accept a
      # signed-but-broken bundle. Catch it here so a bad build can never
      # reach the release artifact.
      run: |
        set -euo pipefail
        APP=build/release-darwin-arm64/ioquakelive.app
        BASE="$APP/Contents/Resources/baseq3"
        echo "Listing $BASE:"
        ls -la "$BASE" || { echo "ERROR: $BASE does not exist" >&2; exit 1; }
        missing=0
        for pk3 in iobin.pk3 pak01.pk3; do
          if [ ! -f "$BASE/$pk3" ]; then
            echo "ERROR: $BASE/$pk3 is missing from the .app bundle" >&2
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1
        shasum -a 256 "$BASE/iobin.pk3" "$BASE/pak01.pk3"
        # Log the bundled dylibs so a Frameworks regression is diagnosable
        # from CI output alone (make-macosx-app.sh already hard-fails on a
        # missing libSDL3).
        echo "Listing $APP/Contents/Frameworks:"
        ls -la "$APP/Contents/Frameworks"

    - name: Codesign app bundle
      env:
        CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "Signing with: $IDENTITY"

        # Walk bundle contents bottom-up. --deep is unreliable with embedded
        # frameworks. ioqlds must be signed individually -
        # bundle signing only touches CFBundleExecutable. The game dylibs
        # inside iobin.pk3 were already signed in macos-compile.
        APP=build/release-darwin-arm64/ioquakelive.app

        # Sign nested dylibs/sos first.
        find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
          | while IFS= read -r -d '' lib; do
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$lib"
            done

        # Sign non-main executables in Contents/MacOS/ (use `file` to detect
        # Mach-O since extensionless binaries have no reliable name pattern).
        find "$APP/Contents/MacOS" -type f -print0 \
          | while IFS= read -r -d '' bin; do
              if file "$bin" | grep -q 'Mach-O'; then
                codesign --force --options runtime --timestamp \
                  --sign "$IDENTITY" "$bin"
              fi
            done

        # Finally, sign the bundle itself.
        codesign --force --options runtime --timestamp \
          --sign "$IDENTITY" "$APP"
        codesign --verify --strict --verbose=2 "$APP"

    - name: Notarise and staple
      env:
        CERT_B64:   ${{ secrets.MACOS_CERTIFICATE_P12 }}
        KEY_ID:     ${{ secrets.MACOS_NOTARY_KEY_ID }}
        KEY_ISSUER: ${{ secrets.MACOS_NOTARY_KEY_ISSUER }}
        KEY_P8:     ${{ secrets.MACOS_NOTARY_KEY_P8 }}
      if: env.CERT_B64 != ''
      run: |
        set -euo pipefail
        echo "$KEY_P8" | base64 -d > AuthKey.p8
        APP=build/release-darwin-arm64/ioquakelive.app
        # ditto preserves the bundle correctly inside the submission zip.
        ditto -c -k --keepParent "$APP" ioquakelive-notarise.zip

        # notarytool submit --wait returns 0 even when status is Invalid,
        # so we have to parse the output and react ourselves.
        SUBMIT_OUT="$(xcrun notarytool submit ioquakelive-notarise.zip \
          --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$KEY_ISSUER" \
          --wait 2>&1 | tee /dev/stderr)"
        SUBMIT_ID="$(echo "$SUBMIT_OUT" | awk '/^  id:/ {print $2; exit}')"
        STATUS="$(echo "$SUBMIT_OUT" | awk '/^  status:/ {print $2; exit}')"
        echo "submission id: $SUBMIT_ID"
        echo "status:        $STATUS"

        if [ -n "$SUBMIT_ID" ]; then
          echo "----- notarisation log -----"
          xcrun notarytool log "$SUBMIT_ID" \
            --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$KEY_ISSUER" || true
          echo "----- end notarisation log -----"
        fi

        rm -f AuthKey.p8 ioquakelive-notarise.zip

        if [ "$STATUS" != "Accepted" ]; then
          echo "ERROR: notarisation status was '$STATUS', expected 'Accepted'" >&2
          exit 1
        fi

        # Staple the ticket to the on-disk .app so Gatekeeper can verify offline.
        xcrun stapler staple "$APP"
        xcrun stapler validate "$APP"

    - name: Stage final app bundle
      run: |
        set -euo pipefail
        mkdir -p staging/engine
        # actions/upload-artifact strips POSIX permissions and breaks
        # bundle symlinks, so tar the .app to preserve everything.
        tar -C build/release-darwin-arm64 -cf staging/engine/ioquakelive.app.tar ioquakelive.app
        # Re-verify pk3s survived signing/notarisation/stapling. If something
        # along the way silently dropped them, fail before the artifact is
        # uploaded so we can never ship a broken release.
        BASE="ioquakelive.app/Contents/Resources/baseq3"
        for pk3 in iobin.pk3 pak01.pk3; do
          if ! tar -tf staging/engine/ioquakelive.app.tar "$BASE/$pk3" >/dev/null 2>&1; then
            echo "ERROR: $BASE/$pk3 missing from staged ioquakelive.app.tar" >&2
            exit 1
          fi
        done
        tar -xOf staging/engine/ioquakelive.app.tar "$BASE/iobin.pk3" | shasum -a 256
        tar -xOf staging/engine/ioquakelive.app.tar "$BASE/pak01.pk3" | shasum -a 256
    - uses: actions/upload-artifact@v4
      with:
        name: engine-macos-arm64
        path: staging/engine/

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install VS 2026 Build Tools (v145)
      shell: pwsh
      run: |
        Write-Host "Installing VS 2026 Build Tools..."
        choco install visualstudio2026buildtools `
          --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet" `
          -y --ignore-package-exit-codes=3010
        Write-Host "VS 2026 Build Tools installation completed"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild misc/msvc/ioquakelive.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /m

    - name: Build the dedicated server
      # A project of its own, deliberately outside the solution: it is the same
      # engine with the client half compiled out, and it has no dependency on
      # SDL or the renderer.
      run: msbuild misc/msvc/ioqlds.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /m

    - name: Stage build outputs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging/libs   | Out-Null
        New-Item -ItemType Directory -Force -Path staging/engine | Out-Null
        Copy-Item build/Release/x64/baseq3/cgamex86_64.dll  staging/libs/
        Copy-Item build/Release/x64/baseq3/qagamex86_64.dll staging/libs/
        Copy-Item build/Release/x64/baseq3/uix86_64.dll     staging/libs/
        # Engine binaries plus the runtime DLLs (SDL3, freetype, ...) that
        # ship next to ioquakelive.exe
        Copy-Item build/Release/x64/*.exe staging/engine/
        Copy-Item build/Release/x64/*.dll staging/engine/
    - uses: actions/upload-artifact@v4
      with:
        name: libs-windows-x64
        path: staging/libs/
    - uses: actions/upload-artifact@v4
      with:
        name: engine-windows-x64
        path: staging/engine/

  package:
    name: Package release artifacts
    needs: [linux, macos-bundle, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download engine artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: engine-*
        path: engines
    - name: Unpack tarred engine artifacts
      run: |
        # Linux and macOS engine binaries are tarred to preserve +x and
        # bundle structure (upload-artifact strips POSIX mode bits).
        for tar in engines/engine-linux-x86_64/linux-x86_64.tar \
                   engines/engine-macos-arm64/ioquakelive.app.tar; do
          if [ -f "$tar" ]; then
            tar -xf "$tar" -C "$(dirname "$tar")"
            rm "$tar"
          fi
        done
        # Sanity-check the executable bit survived.
        ls -l engines/engine-linux-x86_64/ioquakelive.x86_64
        ls -l engines/engine-macos-arm64/ioquakelive.app/Contents/MacOS/
    - name: Download universal iobin.pk3
      uses: actions/download-artifact@v4
      with:
        name: iobin-pk3
        path: shared/baseq3/
    - name: Download deterministic pak01.pk3
      uses: actions/download-artifact@v4
      with:
        name: pak01-pk3
        path: shared/baseq3/
    - name: Verify shared artifact hashes
      run: sha256sum shared/baseq3/iobin.pk3 shared/baseq3/pak01.pk3
    - name: Build per-platform release zips
      run: |
        python code/tools/build_release_zips.py \
          --shared shared \
          --server content/server \
          --engines engines \
          --output build
        ls -la build/
    - uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: build/*.zip

  release:
    name: Create Release
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from commit message
      id: version
      env:
        MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$MSG" | head -1 | sed 's/^release: *//')
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Create tag
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    - uses: actions/download-artifact@v4
      with:
        name: release-zips
        path: artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.version }}
        files: artifacts/*.zip
        generate_release_notes: true
